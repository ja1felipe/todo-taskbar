[package]
name = "todobar"
version = "0.2.5"
description = "Lista de tarefas na bandeja do sistema, com abas e histórico de conclusão"
authors = ["João Felipe <ja1felipe@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/ja1felipe/todo-taskbar"
homepage = "https://github.com/ja1felipe/todo-taskbar"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "todobar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Carrega o `.env` também no build, para embutir as credenciais públicas no
# binário (necessário no mobile, onde não existe `.env` em runtime).
dotenvy = "0.15"

[dependencies]
# `image-png` decodifica o PNG do ícone da bandeja (`icons/newicon`), que é
# embutido no binário com `include_bytes!`. `macos-private-api` é exigida pelo
# `macOSPrivateApi` do tauri.conf.json (janela transparente no macOS) e a CLI
# valida essa correspondência no host, então fica aqui mesmo sendo inerte fora
# do macOS.
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Só o `sync` (mutex assíncrono), usado para serializar a renovação do token:
# o `refresh_token` do Supabase gira a cada uso e duas renovações concorrentes
# com o mesmo token derrubariam a sessão.
tokio = { version = "1", features = ["sync"] }
# UUID v4 para identificar cada item entre dispositivos. O `id` inteiro local
# continua sendo a identidade que o frontend já conhece.
uuid = { version = "1", features = ["v4"] }

# Cliente HTTP para o Supabase (GoTrue/PostgREST). `rustls-tls` evita depender
# do OpenSSL do sistema, o que facilita o build multiplataforma (e o Android no
# futuro). Ficamos no reqwest 0.12 de propósito: no 0.13 a feature `rustls` usa
# o `rustls-platform-verifier`, que no Android exige inicialização por JNI
# (contexto da Activity) que o Tauri não faz, e todo HTTPS falha. O 0.12 usa
# `webpki-roots` (raízes Mozilla embutidas) e funciona no Android sem essa
# inicialização.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Carrega o `.env` em desenvolvimento, para as credenciais não ficarem embutidas
# no binário.
dotenvy = "0.15"

# Banco local. `bundled` compila o SQLite junto do binário, então o app não
# depende de `libsqlite3` do sistema e não quebra se o usuário trocar de distro.
rusqlite = { version = "0.40", features = ["bundled"] }
# Horário de conclusão: gravamos em Brasília (America/Sao_Paulo), que hoje é
# UTC-03:00 e não observa horário de verão desde 2019. Usamos `chrono-tz` em
# vez de fixar o offset, para a conversão seguir as regras da IANA.
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# O tray, o autostart e a atualização in-app dependem de APIs do sistema
# operacional que o Android não expõe, então ficam declarados apenas para as
# plataformas desktop. No Android o app é atualizado por fora (APK novo no
# GitHub) e não tem bandeja nem inicialização automática.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
# "Abrir ao inicializar": cria/remove a entrada de autostart do sistema
# (~/.config/autostart no Linux, chave de registro no Windows, LaunchAgent no
# macOS).
tauri-plugin-autostart = "2"
# Atualização in-app: consulta o `latest.json` da última release, baixa o
# pacote assinado e instala.
tauri-plugin-updater = "2"
# Necessário para relançar o app depois de instalar a atualização.
tauri-plugin-process = "2"

# No Linux o tray do Tauri usa apenas StatusNotifierItem (D-Bus), protocolo que
# não tem evento de botão direito e cujo menu é exibido pelo painel. Para ter o
# comportamento nativo (esquerdo abre, direito abre menu) criamos um
# GtkStatusIcon (XEmbed) via FFI. O gtk3 já é linkado pelo webkit2gtk, então
# reaproveitamos a mesma lib sem custo extra.
[target.'cfg(target_os = "linux")'.dependencies]
gtk-sys = "0.18"
gdk-sys = "0.18"
gdk-pixbuf-sys = "0.18"
gobject-sys = "0.18"
glib-sys = "0.18"
x11 = { version = "2", features = ["xlib"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
