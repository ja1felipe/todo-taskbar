name: Release

on:
  push:
    tags:
      - 'v*'
  # Permite gerar a release pela aba "Actions", sem precisar criar a tag antes.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex.: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      # Uma release por vez: builds paralelos competem pelo mesmo upload, então
      # se o macOS falhar não queremos perder o Linux.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''
          - platform: windows-latest
            args: ''
            rust-target: ''
          # O macos-latest já é Apple Silicon. O macos-13 (Intel) foi retirado
          # pelo GitHub em dez/2025; o rótulo Intel atual é macos-15-intel.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
            rust-target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # O tauri-action precisa do histórico para derivar a tag.
          fetch-depth: 0

      # WebKitGTK e GTK3 não vêm no runner. `libgtk-3-dev` é explícito porque o
      # tray do Linux acessa o GtkStatusIcon via FFI, e não pelo crate `gtk` do
      # Rust: sem isso o `gtk-sys` não acha os headers.
      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Dependências do frontend
        run: npm ci

      - name: Testes do banco
        run: cargo test --manifest-path ./src-tauri/Cargo.toml

      - name: Build e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Conteúdo de `~/.tauri/todobar.key`. Sem ela o build falha, porque
          # `createUpdaterArtifacts` está ligado no tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Embutidos em tempo de compilação via `option_env!` no supabase.rs.
          # São públicos (a `anon key` é protegida pelo RLS); por isso ficam em
          # Variables, não em Secrets. Sem eles o app sai sem sync.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Todo Taskbar ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Todo Taskbar ${{ inputs.tag || github.ref_name }}

            Lista de tarefas no tray do sistema, com abas, banco SQLite e
            registro de conclusão em horário de Brasília.

            ### Linux
            - `*.deb` — `sudo apt install ./*.deb` (atualiza sozinho, pedindo senha)
            - `*.AppImage` — dê permissão de execução e abra (atualiza sozinho)

            Precisa de `libwebkit2gtk-4.1-0` e `libgtk-3-0` instalados.
            No Ubuntu 22.04 ou inferior, use o pacote `libwebkit2gtk-4.0-dev`.

            ### Windows
            - `*-setup.exe` — instalador (NSIS), atualiza sozinho
            - `*.msi` — instalador MSI

            ### macOS
            - `*.dmg` — arraste o `Todo Taskbar.app` para a pasta Aplicativos
            - `*.app.tar.gz` — pacote portátil

            ### Android
            - `todo-taskbar_<tag>_arm64-v8a.apk` — celulares Android modernos (recomendado)
            - `todo-taskbar_<tag>_armeabi-v7a.apk` — celulares 32-bit mais antigos
            - `todo-taskbar_<tag>_x86_64.apk` / `x86` — emuladores

            Baixe o APK da arquitetura do aparelho e instale (habilite "instalar
            apps de fontes desconhecidas"). A assinatura é própria, não é da Play
            Store, então o Android pode pedir confirmação.

            Os instaladores não têm assinatura de plataforma (certificado de
            desenvolvedor). No macOS, o Gatekeeper vai avisar: *Ajustes do
            Sistema → Privacidade e Segurança → Abrir mesmo assim*. As
            atualizações automáticas usam assinatura própria do app.
          args: ${{ matrix.args }}
          releaseDraft: false
          prerelease: false
          # Gera o latest.json que o updater in-app consulta.
          includeUpdaterJson: true

  # Gera os APKs Android (release, por ABI), assina e anexa à release criada
  # acima. O projeto `gen/android` não é versionado; é recriado aqui com
  # `tauri android init`.
  android:
    name: Android APK
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - uses: android-actions/setup-android@v3
        with:
          # O default do action é "tools platform-tools", mas o pacote legado
          # `tools` não existe mais no repositório do SDK e faz o action falhar.
          packages: 'platform-tools'

      - name: Instalar SDK/NDK do Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Dependências do frontend
        run: npm ci

      - name: Gerar projeto Android
        run: npx tauri android init --ci --skip-targets-install

      - name: Build dos APKs (release, por ABI)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run tauri -- android build --apk --split-per-abi

      - name: Preparar keystore de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/todobar.keystore
          else
            keytool -genkeypair -keystore /tmp/todobar.keystore -alias todobar \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass todobar -keypass todobar \
              -dname "CN=Todo Taskbar, O=ja1felipe, C=BR"
            echo "::warning title=Keystore efêmero::Configure o secret ANDROID_KEYSTORE_BASE64 para assinatura estável; sem ele cada release exige reinstalar o app."
          fi

      - name: Assinar APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_PASS="${KEYSTORE_PASSWORD:-todobar}"
          KEY_PASS="${KEY_PASSWORD:-todobar}"
          ALIAS="${KEY_ALIAS:-todobar}"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p /tmp/apks
          # Alinhados ficam fora de /tmp/apks para não serem enviados à release.
          ALIGNED_DIR="$(mktemp -d)"
          shopt -s nullglob
          for apk in src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do
            abi="$(basename "$(dirname "$(dirname "$apk")")")"
            [ "$abi" = "universal" ] && continue
            case "$abi" in
              arm64) out_abi="arm64-v8a" ;;
              arm)   out_abi="armeabi-v7a" ;;
              x86)   out_abi="x86" ;;
              x86_64) out_abi="x86_64" ;;
              *) out_abi="$abi" ;;
            esac
            aligned="$ALIGNED_DIR/${out_abi}-aligned.apk"
            out="/tmp/apks/todo-taskbar_${TAG_NAME}_${out_abi}.apk"
            "$BT/zipalign" -p -f 4 "$apk" "$aligned"
            "$BT/apksigner" sign --ks /tmp/todobar.keystore \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
              --ks-key-alias "$ALIAS" --out "$out" "$aligned"
          done
          ls -la /tmp/apks

      - name: Anexar APKs à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" /tmp/apks/todo-taskbar_*.apk --clobber
